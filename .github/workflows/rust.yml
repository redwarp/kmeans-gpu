name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test rust
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rust stable
        uses: dtolnay/rust-toolchain@stable

      # Lavapipe is mesa's software vulkan implementation, so tests can run without a GPU.
      - name: Install lavapipe
        shell: bash
        run: |
          set -e

          sudo apt-get update -y -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Disable debug
        shell: bash
        run: |
          mkdir -p .cargo
          echo """
          [profile.dev]
          incremental = false
          debug = 1" >> .cargo/config.toml

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-test
          cache-on-failure: true

      - name: Build
        run: cargo build

      - name: Run tests
        run: WGPU_BACKEND="vulkan" cargo test
